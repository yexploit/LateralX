services:
  lateralx:
    build: .
    ports:
      - "8000:8000"
    environment:
      LATERALX_SEED_ON_STARTUP: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
